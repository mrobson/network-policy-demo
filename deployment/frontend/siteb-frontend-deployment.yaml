apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: siteb-frontend
    app.kubernetes.io/component: siteb-frontend
    app.kubernetes.io/instance: siteb-frontend
    app.kubernetes.io/name: siteb-frontend
    app.kubernetes.io/part-of: siteb-frontend
    app.openshift.io/runtime: redhat
  name: siteb-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siteb-frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: siteb-frontend
        deployment: siteb-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-5.ocpv.tamlab.rdu2.redhat.com
      containers:
      - image: quay.io/mrobson/simple-http-server:latest
        imagePullPolicy: Always
        name: http-server
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {}
