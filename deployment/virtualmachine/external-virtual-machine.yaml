apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: external-vm
  labels:
    internet: 'true'
spec:
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        creationTimestamp: null
        name: external-vm
      spec:
        sourceRef:
          kind: DataSource
          name: rhel9
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  runStrategy: RerunOnFailure
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: rhel9
        vm.kubevirt.io/workload: server
      creationTimestamp: null
      labels:
        kubevirt.io/domain: external-vm
        kubevirt.io/size: small
        network.kubevirt.io/headlessService: headless
        internet: 'true'
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-5.ocpv.tamlab.rdu2.redhat.com
      architecture: amd64
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - bridge: {}
              model: virtio
              name: default
              state: up
          logSerialConsole: false
          rng: {}
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        machine:
          type: pc-q35-rhel9.6.0
        memory:
          guest: 1Gi
        resources: {}
      networks:
        - multus:
            networkName: default/vlan530
          name: default
      terminationGracePeriodSeconds: 180
      volumes:
        - dataVolume:
            name: external-vm
          name: rootdisk
        - cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: cloud-user
              password: p@ssw0rd
              chpasswd: { expire: False }
          name: cloudinitdisk
